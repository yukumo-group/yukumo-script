name: Go Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install MinGW (Windows CGO)
        if: runner.os == 'Windows'
        run: choco install mingw -y

      # beep/speaker → oto needs ALSA headers for typecheck with CGO on Linux
      - name: Install ALSA (Linux CGO)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
        env:
          CGO_ENABLED: "1"
